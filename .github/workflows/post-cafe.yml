name: post-cafe

on:
  workflow_dispatch:
    inputs:
      group:
        description: "게시할 항목 그룹 (ITEMS_FIRST / ITEMS_SECOND / 전체)"
        type: choice
        options: [all, first, second]
        default: all
  # cron은 UTC 기준. KST = UTC+9
  schedule:
    - cron: "0 21 * * 0-5"  # ITEMS_FIRST: 월~토 KST 06:00 (UTC 전날 21:00 → 일~금)
    - cron: "0 1 * * 1-6"   # ITEMS_SECOND: 월~토 KST 10:00

jobs:
  post:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: action
    env:
      TZ: Asia/Seoul  # 스크립트의 '오늘' 날짜를 한국 기준으로
      # 스케줄은 실행된 cron으로 그룹을 정하고, 수동 실행은 입력값을 쓴다
      ITEM_GROUP: ${{ github.event_name == 'schedule' && (github.event.schedule == '0 21 * * 0-5' && 'first' || 'second') || inputs.group }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum
          pip install -r requirements.txt

      - name: Draw charts
        env:
          GARAK_API_ID: ${{ secrets.GARAK_API_ID }}
          GARAK_API_PASSWD: ${{ secrets.GARAK_API_PASSWD }}
        run: python auction_chart.py

      - name: Post articles
        id: post
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_REFRESH_TOKEN: ${{ secrets.NAVER_REFRESH_TOKEN }}
          GARAK_API_ID: ${{ secrets.GARAK_API_ID }}
          GARAK_API_PASSWD: ${{ secrets.GARAK_API_PASSWD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set +e
          python post_auction_articles.py
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Upload charts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: charts
          path: action/output/*.png
          if-no-files-found: ignore

      - name: Notify Discord on failure
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EXIT_CODE: ${{ steps.post.outputs.code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$EXIT_CODE" = "2" ]; then
            msg="네이버 토큰이 만료됐거나 재발급에 실패했습니다. 로컬에서 token_tools/naver_login.py 로 다시 로그인해 NAVER_REFRESH_TOKEN 시크릿을 갱신하세요."
          else
            msg="네이버 카페 글쓰기 워크플로가 실패했습니다."
          fi
          payload=$(jq -n --arg c "$msg"$'\n'"$RUN_URL" '{content: $c}')
          curl -sS -H "Content-Type: application/json" -d "$payload" "$WEBHOOK"
